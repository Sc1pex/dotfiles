# /var/home/scipex/.config/tmuxinator/nfib.yml

name: nfib
root: ~/dev/Projects/nfib

windows:
  - nvim:
      layout: main-vertical
      panes:
        - "nvim -c ':SessionManager load_current_dir_session'"
  - run:
      layout: even-horizontal
      panes:
        - cd runner
        - cd impls/bin && ./run_local.sh
